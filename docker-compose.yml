name: ninshiki

# DESENVOLVIMENTO (senhas padrão, código montado por volume, hot reload). Produção: docker-compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ninshiki
      POSTGRES_PASSWORD: ninshiki
      POSTGRES_DB: ninshiki
      # Subpasta do volume: evita o erro "directory exists but is not empty" (lost+found, init interrompido).
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432" # só a própria máquina; nunca exponha o banco na rede
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninshiki -d ninshiki"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ninshiki:ninshiki@db:5432/ninshiki
      PORT: "3000"
      FILES_DIR: /data/files
      # Chave que criptografa números de conta e tokens (32 bytes em base64: openssl rand -base64 32).
      # Se ficar vazia, uma chave é gerada e guardada em /data/files/.datakey. Em produção, defina e guarde fora do banco.
      # Open Finance real (opcional; sem isso só há o banco de demonstração). Credenciais em https://dashboard.pluggy.ai
      PLUGGY_CLIENT_ID: "${PLUGGY_CLIENT_ID:-}"
      PLUGGY_CLIENT_SECRET: "${PLUGGY_CLIENT_SECRET:-}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - files:/data/files

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    depends_on:
      - api
    ports:
      - "5173:5173" # acessível na rede local para testar no celular
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  files:
  api_node_modules:
  web_node_modules:
