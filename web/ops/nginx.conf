server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # nginx não herda add_header entre blocos: por isso os cabeçalhos são repetidos em cada location.
    set $csp "default-src 'self'; script-src 'self' https://cdn.pluggy.ai; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.pluggy.ai; connect-src 'self' https://*.pluggy.ai; frame-src https://*.pluggy.ai; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }

    # Arquivos com hash no nome: cache longo e imutável.
    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker e manifest: sempre revalidados, senão as atualizações não chegam aos aparelhos.
    location ~ ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA: as rotas do React caem no index.html (sem cache).
    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
