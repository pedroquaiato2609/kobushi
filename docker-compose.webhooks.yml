# Start with: docker compose -f docker-compose.yml -f docker-compose.webhooks.yml up -d webhook-gateway webhook-tunnel
services:
  webhook-gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./ops/webhook-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  webhook-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --url http://webhook-gateway:8080
    restart: unless-stopped
    depends_on:
      - webhook-gateway
