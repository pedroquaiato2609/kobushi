server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    location = /webhooks/pluggy {
        limit_except POST { deny all; }
        resolver 127.0.0.11 valid=10s;
        set $upstream http://api:3000;
        proxy_pass $upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
    }
    location / { return 404; }
}
